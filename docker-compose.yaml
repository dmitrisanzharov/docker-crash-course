version: '3.8'

services:
    api:
        build: './api'
        container_name: 'api'
        ports:
            - '4000:4000'
        volumes:
            - './api:/api'
            - '/api/node_modules'

    api2:
        build: './api2'
        container_name: 'api2'
        ports: 
            - '5000:5000'
        volumes:
            - './api2:/api'
            - 'api2_node_mods:/api/node_modules'


volumes:
    api2_node_mods: